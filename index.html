<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30년 뒤 나의 집 공간 배치 플래너</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf0ee; --grid:#cfdad6; --ink:#17262f; --sub:#4b5f68;
  --wall:#17262f; --room:#f7faf9; --accent:#1f6f66; --accent-ink:#ffffff; --marker:#f2c14e; --soft:#9fc3bc; --bad:#e2705f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10191d; --grid:#1c2a30; --ink:#e8f0ee; --sub:#9fb2b8;
    --wall:#e8f0ee; --room:#16232a; --accent:#5fc2b3; --accent-ink:#0c1a1e; --marker:#e0b04a; --soft:#2f5a55; --bad:#c9483a;
  }
}
:root[data-theme="dark"]{
  --bg:#10191d; --grid:#1c2a30; --ink:#e8f0ee; --sub:#9fb2b8;
  --wall:#e8f0ee; --room:#16232a; --accent:#5fc2b3; --accent-ink:#0c1a1e; --marker:#e0b04a; --soft:#2f5a55; --bad:#c9483a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
#intro{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:0 auto;padding:32px 24px}
.plan{width:100%;height:auto;max-height:42vh;margin-bottom:28px}
.plan .wall{fill:var(--room);stroke:var(--wall);stroke-width:5;stroke-linejoin:round}
.plan .inner{stroke:var(--wall);stroke-width:3;fill:none}
.plan .gap{stroke:var(--room);stroke-width:6}
.plan .door{stroke:var(--wall);stroke-width:2;fill:none;stroke-linecap:round}
.plan .swing{stroke:var(--wall);stroke-width:1.5;fill:none;stroke-dasharray:3 3}
.plan .win{fill:var(--room);stroke:var(--wall);stroke-width:1.5}
.plan .item{fill:var(--soft);stroke:var(--wall);stroke-width:2}
.plan .mark{fill:var(--marker);stroke:var(--wall);stroke-width:2;animation:drop .9s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes drop{from{transform:translate(46px,-34px);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 12px;font-size:clamp(2rem,9vw,2.9rem);line-height:1.15;font-weight:800;letter-spacing:-.03em;word-break:keep-all}
p.desc{margin:0 0 32px;font-size:1.0625rem;line-height:1.6;color:var(--sub);word-break:keep-all;max-width:36em}
button.start{appearance:none;border:0;cursor:pointer;width:100%;min-height:56px;padding:0 28px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.125rem;font-weight:700}
@media (min-width:520px){button.start{width:auto;min-width:180px}}
.btn{appearance:none;cursor:pointer;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--ink);background:var(--room);color:var(--ink);font:inherit;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
#steps{display:flex;gap:6px;list-style:none;margin:0 0 16px;padding:0}
#steps li{flex:1;padding:8px 6px;text-align:center;font-size:.875rem;font-weight:700;border-bottom:4px solid var(--grid);color:var(--sub);background:var(--room)}
#steps li[aria-current]{border-color:var(--accent);color:var(--ink)}
#app h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.02em}
.sub{margin:0 0 14px;color:var(--sub);line-height:1.5;word-break:keep-all}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.row>*{min-width:0}
.row input,.row select{min-height:44px;padding:0 10px;border-radius:10px;border:2px solid var(--wall);background:var(--room);color:var(--ink);font:inherit}
.g{flex:1 1 90px}.s{width:4.4em}
.sum{margin:12px 0;font-weight:700;line-height:1.5;word-break:keep-all}
.chips,.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stage{background:var(--bg);border:2px solid var(--wall);border-radius:12px;padding:8px;margin-bottom:10px}
.stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .btn{flex:1}
.box{border:2px solid var(--wall);border-radius:12px;padding:10px;background:var(--room);margin-bottom:10px}
.rg{display:flex;gap:8px;align-items:center;margin:8px 0;font-weight:600}.rg input[type=range]{flex:1;min-width:0}
.row label{display:flex;gap:6px;align-items:center;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--wall)}.bl{width:2.6em;font-weight:700}.bt{flex:1;height:12px;background:var(--grid);border-radius:6px;overflow:hidden}.bt i{display:block;height:100%}.bn{width:7em;text-align:right}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:12px;font-weight:600;max-width:calc(100% - 48px);text-align:center;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.plan .mark{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<main id="intro">
  <svg class="plan" viewBox="0 0 320 200" role="img" aria-label="문과 창문 기호가 표시된 집 평면도">
    <rect class="wall" x="10" y="10" width="300" height="180" rx="4"/>
    <path class="inner" d="M190 10V110M190 110H310M10 120H120M120 120V190"/>
    <path class="gap" d="M190 50V80M240 110H270M60 120H90"/>
    <path class="door" d="M190 50H160M240 110V80M60 120V90"/>
    <path class="swing" d="M160 50A30 30 0 0 0 190 80M240 80A30 30 0 0 1 270 110M60 90A30 30 0 0 1 90 120"/>
    <g class="win">
      <rect x="40" y="7" width="50" height="6"/><rect x="215" y="7" width="70" height="6"/>
      <rect x="307" y="130" width="6" height="40"/><rect x="140" y="187" width="40" height="6"/><rect x="7" y="40" width="6" height="30"/>
    </g>
    <path class="door" d="M40 10H90M215 10H285M310 130V170M140 190H180M10 40V70" stroke-width="1"/>
    <rect class="item" x="22" y="24" width="84" height="62" rx="4"/>
    <rect class="item" x="22" y="134" width="70" height="40" rx="4"/>
    <rect class="item" x="205" y="124" width="90" height="50" rx="4"/>
    <rect class="item" x="136" y="136" width="40" height="40" rx="20"/>
    <rect class="mark" x="204" y="26" width="64" height="40" rx="4"/>
  </svg>
  <h1>30년 뒤 나의 집 공간 배치 플래너</h1>
  <p class="desc">30년 뒤에 살고 싶은 집을 그려 보며, 방과 가구를 미리 배치해 봐요.</p>
  <div><button class="start" id="start" type="button">시작</button></div>
</main>
<section id="app" hidden>
  <ol id="steps"></ol>
  <div id="view"></div>
  <div class="nav"><button class="btn" id="prev" type="button">이전</button><button class="btn pri" id="next" type="button">다음</button></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
var K='plan30',$=function(i){return document.getElementById(i)};
var RL=['나','배우자','자녀','부모','반려동물','기타'];
var RT={'침실':[3,3.5],'거실':[4,4],'주방':[3,3],'욕실':[2,2],'서재':[3,3],'현관':[1.5,2],'기타':[3,3]};
var FU=[['침대',1.6,2],['소파',2,.9],['식탁',1.4,.8],['책상',1.2,.6],['옷장',1,.6],['냉장고',.7,.7],['변기',.4,.7],['세면대',.6,.45]];
function fresh(s){return{step:s,m:[{n:'나',r:'나',a:''}],o:[],f:[],id:1,sel:null,rt:[],ra:null,tab:'f',zv:1}}
function load(){try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.m&&d.o&&d.f)return d}catch(e){}return null}
var S=load()||fresh(0),L=[],D=null,dl=null,tt,rt;
S.rt=S.rt||[];S.tab=S.tab||'f';if(S.zv==null)S.zv=1;S.dr=0;
var ZN={'휴식':'#8fb3d9','생활':'#e6c36a','위생':'#7cc7b5','이동':'#d3a0c8','기타':'#b9bfc2'},ZD={'침실':'휴식','서재':'휴식','거실':'생활','주방':'생활','욕실':'위생','현관':'이동','기타':'기타'},RC=['#d9480f','#1c7ed6','#2f9e44','#ae3ec9','#f08c00'];
function zn(r){return r.z||ZD[r.t]||'기타'}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){x.classList.remove('show')},2400)}
function cl(v){return Math.min(20,Math.max(1,+v||0))}
function go(n){S.step=n;S.sel=null;save();render();window.scrollTo(0,0)}

function v1(){
  return '<h2>함께 살 사람</h2><p class="sub">30년 뒤 같이 살고 있을 사람을 적어 주세요.</p>'+
  S.m.map(function(m,i){return '<div class="row" data-i="'+i+'"><input class="g" data-k="n" placeholder="이름" aria-label="이름" value="'+e(m.n)+'"><select data-k="r" aria-label="관계">'+
  RL.map(function(r){return '<option'+(r==m.r?' selected':'')+'>'+r+'</option>'}).join('')+'</select><input class="s" data-k="a" type="number" min="0" max="120" placeholder="나이" aria-label="30년 뒤 나이" value="'+e(m.a)+'"><button class="btn" data-del="'+i+'">삭제</button></div>'}).join('')+
  '<button class="btn" data-add>구성원 추가</button><p class="sum" id="sum"></p>';
}
function v2(){
  return '<h2>방</h2><p class="sub">방 종류와 이름, 가로·세로 크기(미터)를 넣어 주세요.</p>'+
  S.o.map(function(r,i){return '<div class="row" data-i="'+i+'"><select data-k="t" aria-label="방 종류">'+
  Object.keys(RT).map(function(t){return '<option'+(t==r.t?' selected':'')+'>'+t+'</option>'}).join('')+'</select><input class="g" data-k="n" placeholder="방 이름" aria-label="방 이름" value="'+e(r.n)+'"><input class="s" data-k="w" type="number" step="0.1" min="1" max="20" aria-label="가로(m)" placeholder="가로" value="'+e(r.w)+'"><input class="s" data-k="h" type="number" step="0.1" min="1" max="20" aria-label="세로(m)" placeholder="세로" value="'+e(r.h)+'"><button class="btn" data-del="'+i+'">삭제</button></div>'}).join('')+
  '<button class="btn" data-add>방 추가</button><p class="sum" id="sum"></p>';
}
function v3(){
  return '<h2>가구 배치</h2><p class="sub">평면도에서 가구를 끌어 옮기고, 아래 탭에서 크기·구역·동선을 다듬어요. 한 칸은 0.5m예요.</p><div class="stage" id="stage"></div><div class="tabs">'+
  [['f','가구'],['z','구역'],['r','동선']].map(function(t){return '<button class="btn'+(S.tab==t[0]?' pri':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+
  '</div><div id="pn"></div><p class="sum" id="msg"></p><div class="ctl"><button class="btn pri" data-img'+(dl?'':' hidden')+'>그림으로 저장</button></div><button class="btn" data-reset>처음부터 다시</button>';
}
function sel(){return S.f.filter(function(g){return g.id==S.sel})[0]}
function ar(){return S.rt.filter(function(r){return r.id==S.ra})[0]}
function len(r){var t=0;for(var i=1;i<r.pts.length;i++)t+=Math.hypot(r.pts[i][0]-r.pts[i-1][0],r.pts[i][1]-r.pts[i-1][1]);return Math.round(t*10)/10}
function dim(){var f=sel(),a=$('dim');if(f&&a){var d=dm(f);a.textContent=d[0].toFixed(1)+' × '+d[1].toFixed(1)+'m';var q=$('pc');if(q)q.textContent=Math.round(f.w/f.bw*100)+'%'}}
function tips(A){
  var p=S.m.filter(function(m){return m.r!='반려동물'}).length,t=[];
  if(p&&(A['휴식']||0)<p*6)t.push('함께 사는 '+p+'명이면 휴식 구역이 '+p*6+'㎡ 이상이면 여유로워요.');
  if((A['생활']||0)<12)t.push('생활 구역이 12㎡보다 좁아요. 거실이나 주방을 조금 넓혀 보세요.');
  if(S.m.some(function(m){return +m.a>=65}))t.push('노년 구성원이 있으면 침실과 욕실이 가깝게 있으면 좋아요.');
  return t.join(' ')||'구역 크기가 구성원 수에 잘 맞아요.';
}
function pn(){
  var h='',t=S.tab,f=sel();
  if(f&&!f.bw){f.bw=f.w;f.bh=f.h}
  if(t=='f'){
    h='<div class="chips">'+FU.map(function(q,i){return '<button class="btn" data-fur="'+i+'">'+q[0]+' 추가</button>'}).join('')+'</div>';
    if(f)h+='<div class="box"><b>'+e(f.k)+'</b> <span id="dim"></span><label class="rg">크기 <input type="range" data-sc min="50" max="200" step="10" value="'+Math.round(f.w/f.bw*10)*10+'"> <span id="pc"></span></label><div class="row"><label>가로(m) <input class="s" type="number" step="0.1" min="0.1" max="10" data-fw value="'+f.w+'"></label><label>세로(m) <input class="s" type="number" step="0.1" min="0.1" max="10" data-fh value="'+f.h+'"></label></div><div class="ctl"><button class="btn" data-bs>기본 크기로</button><button class="btn" data-rot>회전</button><button class="btn" data-rm>선택한 가구 삭제</button></div></div>';
    else h+='<p class="sub">크기를 바꾸려면 가구를 먼저 눌러 주세요.</p>';
  }else if(t=='z'){
    var A={},T=0;L.forEach(function(r){A[r.z]=(A[r.z]||0)+r.w*r.h;T+=r.w*r.h});
    h='<label class="rg"><input type="checkbox" data-zv'+(S.zv?' checked':'')+'> 구역 색 보기</label>'+
    S.o.map(function(r,i){return '<div class="row"><span class="g">'+e(r.n||r.t)+'</span><select data-zi="'+i+'" aria-label="구역">'+Object.keys(ZN).map(function(z){return '<option'+(z==zn(r)?' selected':'')+'>'+z+'</option>'}).join('')+'</select></div>'}).join('')+
    Object.keys(ZN).map(function(z){var a=A[z]||0,q=T?Math.round(a/T*100):0;return '<div class="bar"><span class="sw" style="background:'+ZN[z]+'"></span><span class="bl">'+z+'</span><span class="bt"><i style="width:'+q+'%;background:'+ZN[z]+'"></i></span><span class="bn">'+(Math.round(a*10)/10)+'㎡ · '+q+'%</span></div>'}).join('')+'<p class="sub">'+tips(A)+'</p>';
  }else{
    h='<div class="ctl"><button class="btn" data-ra>동선 추가</button><button class="btn'+(S.dr?' pri':'')+'" data-dr>'+(S.dr?'그리기 끄기':'동선 그리기')+'</button><button class="btn" data-pu>점 지우기</button></div><p class="sub">'+(S.dr?'평면도를 눌러 점을 이어 보세요. 현관에서 시작하면 좋아요.':'동선을 고른 뒤 [동선 그리기]를 켜 주세요.')+'</p>'+
    S.rt.map(function(r,i){return '<div class="row" data-ri="'+i+'"><button class="btn'+(S.ra==r.id?' pri':'')+'" data-rs="'+i+'" style="border-color:'+r.c+'">선택</button><input class="g" data-rn placeholder="동선 이름" aria-label="동선 이름" value="'+e(r.n)+'"><label><input type="checkbox" data-rv'+(r.v?' checked':'')+'> 보이기</label><span>'+len(r)+'m</span><button class="btn" data-rd="'+i+'">삭제</button></div>'}).join('');
  }
  $('pn').innerHTML=h;dim();
}
function sum(){
  var s=$('sum');if(!s)return;
  if(S.step==1){s.textContent='함께 사는 사람은 모두 '+S.m.length+'명이에요.'}
  else{var a=0,p=S.m.filter(function(m){return m.r!='반려동물'}).length,b=S.o.filter(function(r){return r.t=='침실'}).length,need=Math.ceil(p/2);
    S.o.forEach(function(r){a+=cl(r.w)*cl(r.h)});
    s.textContent='방 '+S.o.length+'개 · 전체 '+(Math.round(a*10)/10)+'㎡'+(p>0&&b<need?'\n함께 사는 '+p+'명이면 침실이 '+need+'개쯤 있으면 편해요. 지금은 '+b+'개예요.':'');
    s.style.whiteSpace='pre-line'}
}
function render(){
  var st=S.step;
  $('intro').hidden=st!=0;$('app').hidden=st==0;
  if(!st)return;
  $('steps').innerHTML=['1 구성원','2 방','3 가구 배치'].map(function(t,i){return '<li'+(i+1==st?' aria-current="step"':'')+'>'+t+'</li>'}).join('');
  $('view').innerHTML=[v1,v2,v3][st-1]();
  $('next').hidden=st==3;
  if(st==3){draw();pn()}else sum();
}
function lay(){
  var x=0,y=0,h=0;
  L=S.o.map(function(r){var w=cl(r.w),hh=cl(r.h);if(x>0&&x+w>12){x=0;y+=h;h=0}
    var p={x:x,y:y,w:w,h:hh,n:r.n||r.t,z:zn(r)};x+=w;h=Math.max(h,hh);return p});
}
function dm(f){return f.r?[f.h,f.w]:[f.w,f.h]}
function ov(a,b){var d=dm(a),c=dm(b);return a.x<b.x+c[0]-1e-6&&b.x<a.x+d[0]-1e-6&&a.y<b.y+c[1]-1e-6&&b.y<a.y+d[1]-1e-6}
function rbad(r){
  var o=[];
  for(var i=1;i<r.pts.length;i++){var a=r.pts[i-1],b=r.pts[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/.1));
    for(var k=0;k<=n;k++){var x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;
      if(S.f.some(function(f){var d=dm(f);return x>f.x&&x<f.x+d[0]&&y>f.y&&y<f.y+d[1]}))o.push([x,y])}}
  return o;
}
function draw(){
  lay();
  var W=0,H=0,s='';
  L.forEach(function(r){W=Math.max(W,r.x+r.w);H=Math.max(H,r.y+r.h)});
  L.forEach(function(r){
    s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" style="fill:var(--room);stroke:var(--wall);stroke-width:.12;stroke-linejoin:round"/>';
    if(S.zv)s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" style="fill:'+ZN[r.z]+';opacity:.5"/>';
    s+='<text x="'+(r.x+.15)+'" y="'+(r.y+.4)+'" font-size=".3" style="fill:var(--ink)">'+e(r.n)+'</text>';
