<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 집 공간 배치 플래너</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eaf0ee; --grid:#cfdad6; --ink:#17262f; --sub:#4b5f68;
  --wall:#17262f; --room:#f7faf9; --accent:#1f6f66; --accent-ink:#ffffff; --marker:#f2c14e; --soft:#9fc3bc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10191d; --grid:#1c2a30; --ink:#e8f0ee; --sub:#9fb2b8;
    --wall:#e8f0ee; --room:#16232a; --accent:#5fc2b3; --accent-ink:#0c1a1e; --marker:#e0b04a; --soft:#2f5a55;
  }
}
:root[data-theme="dark"]{
  --bg:#10191d; --grid:#1c2a30; --ink:#e8f0ee; --sub:#9fb2b8;
  --wall:#e8f0ee; --room:#16232a; --accent:#5fc2b3; --accent-ink:#0c1a1e; --marker:#e0b04a; --soft:#2f5a55;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background-color:var(--bg);color:var(--ink);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
main{
  min-height:100%;display:flex;flex-direction:column;justify-content:center;
  max-width:560px;margin:0 auto;padding:32px 24px;
}
.plan{width:100%;height:auto;max-height:42vh;margin-bottom:28px}
.plan .wall{fill:var(--room);stroke:var(--wall);stroke-width:5;stroke-linejoin:round}
.plan .inner{stroke:var(--wall);stroke-width:3;fill:none}
.plan .gap{stroke:var(--room);stroke-width:6}
.plan .item{fill:var(--soft);stroke:var(--wall);stroke-width:2}
.plan .mark{fill:var(--marker);stroke:var(--wall);stroke-width:2;animation:drop .9s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes drop{from{transform:translate(46px,-34px);opacity:0}to{transform:none;opacity:1}}
h1{
  margin:0 0 12px;font-size:clamp(2rem,9vw,2.9rem);line-height:1.15;
  font-weight:800;letter-spacing:-.03em;word-break:keep-all;
}
p.desc{margin:0 0 32px;font-size:1.0625rem;line-height:1.6;color:var(--sub);word-break:keep-all;max-width:36em}
button.start{
  appearance:none;border:0;cursor:pointer;width:100%;
  min-height:56px;padding:0 28px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);
  font:inherit;font-size:1.125rem;font-weight:700;
  transition:transform .12s ease,filter .12s ease;
}
button.start:hover{filter:brightness(1.08)}
button.start:active{transform:scale(.98)}
button.start:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (min-width:520px){button.start{width:auto;min-width:180px}}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:12px;
  font-size:1rem;font-weight:600;max-width:calc(100% - 48px);text-align:center;
  transition:opacity .2s ease,transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .plan .mark{animation:none}
  .toast,button.start{transition:none}
}
</style>
</head>
<body>
<main>
  <svg class="plan" viewBox="0 0 320 200" role="img" aria-label="방과 가구가 그려진 집 평면도">
    <rect class="wall" x="10" y="10" width="300" height="180" rx="4"/>
    <path class="inner" d="M190 10V110M190 110H310M10 120H120M120 120V190"/>
    <path class="gap" d="M190 50V80M240 110H270M60 120H90"/>
    <rect class="item" x="22" y="24" width="84" height="62" rx="4"/>
    <rect class="item" x="22" y="134" width="70" height="40" rx="4"/>
    <rect class="item" x="205" y="124" width="90" height="50" rx="4"/>
    <rect class="item" x="136" y="136" width="40" height="40" rx="20"/>
    <rect class="mark" x="204" y="26" width="64" height="40" rx="4"/>
  </svg>
  <h1>우리 집 공간 배치 플래너</h1>
  <p class="desc">방 크기를 넣고 가구를 옮겨 보며, 사기 전에 우리 집에 맞는지 미리 확인해요.</p>
  <div><button class="start" id="start" type="button">시작</button></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite">준비 중이에요</div>
<script>
(function(){
  var btn=document.getElementById('start');
  var toast=document.getElementById('toast');
  var timer;
  btn.addEventListener('click',function(){
    toast.classList.add('show');
    clearTimeout(timer);
    timer=setTimeout(function(){toast.classList.remove('show');},2200);
  });
})();
</script>
</body>
</html>
